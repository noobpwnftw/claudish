name: Check
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q claudish platforms scripts
      - name: PIME Python contract smoke (pinned upstream textService.py)
        run: >
          python -c "import hashlib, urllib.request;
          data = urllib.request.urlopen('https://raw.githubusercontent.com/EasyIME/PIME/e0ddf2ffc180837c2e9f8be363de4455c7532962/python/textService.py').read();
          assert hashlib.sha256(data).hexdigest() == 'c84fc2e9e79824d0d7692c895ba385287f6e29a3e5ba8cc25945b913694026ce';
          open('textService.py', 'wb').write(data)"
          && python tests/pime_smoke.py --pime-source textService.py
  ibus-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ibus gir1.2-ibus-1.0 python3-gi dbus
      - name: Real IBus bindings on a private session bus
        run: dbus-run-session -- /usr/bin/python3 tests/ibus_smoke.py
  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python platforms/macos/build.py
      - name: Load native controller and check Objective-C selectors
        run: .tools/macos-build-venv/bin/python -c "import sys; sys.path.insert(0, 'platforms/macos'); import controller"
      - name: Verify bundle signature
        run: codesign --verify --deep --strict dist/macos/Claudish.app
